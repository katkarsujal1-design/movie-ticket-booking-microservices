services:
  frontend:
    build: ./frontend
    container_name: movie-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_MOVIE_SERVICE_URL: http://localhost:3001
      VITE_BOOKING_SERVICE_URL: http://localhost:3002
      VITE_PAYMENT_SERVICE_URL: http://localhost:3003
      VITE_NOTIFICATION_SERVICE_URL: http://localhost:3005
    depends_on:
      movie-theatre-service:
        condition: service_started
      booking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - movie-network

  movie-theatre-service:
    build: ./movie-theatre-service
    container_name: movie-theatre-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: movie_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - movie-network

  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: booking_db
      KAFKA_BROKER: kafka:9092
      THEATRE_SERVICE_URL: http://movie-theatre-service:3001
      BOOKING_EVENTS_TOPIC: booking-events
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      movie-theatre-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: payment-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: payment_db
      PAYMENT_SIMULATION_MODE: random
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "3005:3005"
    environment:
      SERVER_PORT: 3005
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: notification_db
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

  mysql:
    image: mysql:8.4
    container_name: movie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

  payment-db:
    image: mysql:8.4
    container_name: movie-payment-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_db
    volumes:
      - payment-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

  kafka:
    image: apache/kafka:latest
    container_name: movie-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: 10000
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - movie-network

networks:
  movie-network:
    driver: bridge

volumes:
  mysql-data:
  payment-db-data:
  kafka-data:
