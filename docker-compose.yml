services:

  # =========================
  # React Frontend
  # =========================
  frontend:
    build: ./frontend
    container_name: movie-frontend
    ports:
      - "5173:5173"
    depends_on:
      - movie-theatre-service
      - booking-service
      - payment-service
    networks:
      - movie-network

  # =========================
  # Movie & Theatre Service
  # =========================
  movie-theatre-service:
    build: ./movie-theatre-service
    container_name: movie-theatre-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: movie_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - movie-network

  # =========================
  # Booking Service
  # =========================
  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: booking_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - movie-network

  # =========================
  # Payment Service
  # =========================
  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: payment_db

      # Kafka address INSIDE Docker
      KAFKA_BROKER: kafka:9092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - movie-network

  # =========================
  # Notification Service
  # =========================
  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: notification_db

      # Kafka address INSIDE Docker
      KAFKA_BROKER: kafka:9092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - movie-network

  # =========================
  # MySQL
  # =========================
  mysql:
    image: mysql:8.4
    container_name: movie-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - movie-network

  # =========================
  # Apache Kafka - KRaft Mode
  # =========================
  kafka:
    image: apache/kafka:latest
    container_name: movie-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - movie-network


# =========================
# Docker Network
# =========================
networks:
  movie-network:
    driver: bridge


# =========================
# Persistent Data
# =========================
volumes:
  mysql-data:
  kafka-data: